<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Крыски</title>
    <!-- A page of its own for the team: kept out of search, out of the
         sitemap and with no link back to the portfolio. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Челлендж команды «Крыски»: месяц рутин на ноги, два раза в неделю." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%237b1730'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Onest:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="./krysky.css" />
  </head>
  <body>
    <main class="page">
      <header class="head">
        <p class="head__team">команда по frame up</p>
        <h1 class="head__title">Крыски</h1>
        <p class="head__lead">Месяц челленджа: два раза в неделю скидываем рутину на ноги. Каждая рутина - шаг по дороге. Кто дойдёт до финиша, забирает приз.</p>
        <p class="head__dates" hidden></p>
      </header>

      <section class="card card--road" aria-label="Дорога до приза">
        <svg class="road" role="img" aria-label="Дорога от старта до приза, на ней крыски команды"></svg>
      </section>

      <section class="card" aria-labelledby="board-title">
        <h2 id="board-title" class="card__title">Кто где</h2>
        <ol class="board"></ol>
        <p class="card__note" hidden></p>
      </section>
    </main>

    <script type="module" src="./krysky.js"></script>
  </body>
</html>
