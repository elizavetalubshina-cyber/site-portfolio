<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Прототип Gym Bro | Елизавета Любшина</title>
  <meta name="description" content="Попробуй Gym Bro: запись тренировки, план, история и напарник. Интерактивный прототип с примером данных." />
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://dizlik.ru/gym-bro-demo/" />
  <meta property="og:title" content="Попробовать Gym Bro" />
  <meta property="og:description" content="Запиши тренировку, поддержи бро или отправь пинок. Интерактивный прототип с примером данных." />
  <meta property="og:image" content="https://dizlik.ru/og/gym-bro.jpg" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./prototype.css" />
  <script type="module" src="./prototype.js"></script>
</head>
<body>
  <header class="page-header">
    <a class="back-link" href="/cases/gym-bro.html">← К кейсу</a>
    <span class="demo-label">Интерактивный прототип</span>
  </header>
  <main class="demo-layout">
    <div class="guide-slot" id="guide-slot">
    <aside class="guide" id="guide" aria-label="Сценарии прототипа">
      <div class="intro">
        <p class="eyebrow">ТРЕНИРОВКИ С НАПАРНИКОМ</p>
        <h1>Gym Bro<span aria-hidden="true">.</span></h1>
        <p class="intro-copy">Запиши тренировку,<br />поддержи своего бро.</p>
      </div>
      <nav class="scenarios" aria-label="Выбрать сценарий" id="scenarios"></nav>
      <div class="scenario-detail">
        <p class="hint" id="hint">Нажми «Начать по плану», чтобы попробовать тренировку.</p>
        <div class="variants" id="variants" aria-label="Варианты сценария"></div>
      </div>
      <p class="demo-note">Это прототип с примером данных.<br />Действия разыгрываются внутри демо.</p>
    </aside>
    </div>
    <section class="preview" id="preview" aria-label="Прототип Gym Bro">
      <div class="device" id="device">
        <div class="screen-viewport" id="viewport">
          <div class="screen" id="screen" tabindex="-1" aria-label="Экран прототипа">
            <img id="screen-image" class="screen-image" src="/gym-bro-demo/screens/80-12474.webp" width="393" height="852" alt="Главная Gym Bro" draggable="false" fetchpriority="high" />
            <div id="hotspots" class="hotspots"></div>
          </div>
        </div>
        <div class="loading" id="loading" role="status" hidden>Загрузка…</div>
      </div>
      <div class="player-tools" id="player-tools" aria-label="Управление прототипом">
        <button class="site-button" type="button" id="back" aria-label="Вернуться к кейсу">← К кейсу</button>
        <button class="site-button" type="button" id="restart" aria-label="Начать заново" title="Начать сценарий заново"><span class="restart-long">Начать заново</span><span class="restart-short">Сначала</span></button>
        <button class="site-button" type="button" id="show-hotspots" aria-pressed="false" aria-label="Подсветить доступные кнопки" title="Подсветить доступные кнопки"><span aria-hidden="true">◉</span><span class="hotspots-label">Кнопки</span></button>
        <button class="site-button menu-toggle" type="button" id="menu-toggle" aria-haspopup="dialog" aria-controls="scenario-menu" aria-expanded="false">Показать меню</button>
      </div>
      <p class="screen-status" id="status" aria-live="polite"></p>
    </section>
  </main>
  <dialog class="scenario-menu" id="scenario-menu" aria-labelledby="menu-title">
    <div class="menu-heading">
      <h2 id="menu-title">Сценарии Gym Bro</h2>
      <button class="site-button menu-close" type="button" id="menu-close" aria-label="Закрыть меню">×</button>
    </div>
    <div class="menu-content" id="menu-content"></div>
  </dialog>
  <noscript>Для интерактивного прототипа нужен JavaScript. <a href="/cases/gym-bro.html">Вернуться к кейсу Gym Bro</a>.</noscript>
</body>
</html>
